name: EmojiOverdrive
options:
  bundleIdPrefix: studio.abstractpollution
  minimumXcodeGenVersion: "2.45.0"
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES
targets:
  EmojiOverdrive:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EmojiOverdrive
        excludes:
          - Info.plist
    info:
      path: EmojiOverdrive/Info.plist
      properties:
        CFBundleDisplayName: Emoji Overdrive
        CFBundleName: EmojiOverdrive
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: Emoji Overdrive 仅在你主动启用“手电筒常亮”时访问后置摄像头闪光灯，不拍摄、不保存任何影像。
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.abstractpollution.EmojiOverdrive
        PRODUCT_NAME: $(TARGET_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - EmojiOverdriveTests
      gatherCoverageData: true

  EmojiOverdriveTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - EmojiOverdriveTests
    dependencies:
      - target: EmojiOverdrive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.abstractpollution.EmojiOverdriveTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/EmojiOverdrive.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/EmojiOverdrive
        BUNDLE_LOADER: $(TEST_HOST)
